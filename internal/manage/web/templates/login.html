{{define "content"}}
<section class="panel narrow">
  <h1>Sign in</h1>
  <form method="post" action="/manage/login">
    <label class="field"><span>Account</span>
      <input name="name" type="text" autocomplete="username" autofocus required></label>
    <label class="field"><span>Password</span>
      <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Continue</button>
  </form>
  <p class="dim">Accounts are added on the service host with <code>umbree-release-manage admin add</code>. There is no sign-up.</p>
</section>
{{end}}

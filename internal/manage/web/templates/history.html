{{define "content"}}
<h1>{{.Component}} history <span class="dim">· {{.Channel}}</span></h1>
{{template "tabs" .}}
<section class="panel">
{{if .Rows}}
<table>
  {{template "rowhead"}}
  <tbody>
  {{range .Rows}}{{template "rowcells" .}}{{end}}
  </tbody>
</table>
{{else}}<p class="dim">No rows yet.</p>{{end}}
</section>
{{end}}
